version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: digitix-hrms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: digitix_hrms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d digitix_hrms"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitix-hrms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://hrms:hrms_password@postgres:5432/digitix_hrms?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: digitix-hrms-secret-key-change-in-production-2026
      JWT_SECRET: digitix-jwt-secret-key-change-in-production-2026
      NEXT_PUBLIC_APP_NAME: Digitix HRMS
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
